<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    <header>
      <img src="images/bank-logo.png" alt="Bank Logo" class="logo">
      <h1 class="bank-heading">
  Welcome to <strong>Mahishmati Nagrik Sahkari Bank</strong>
</h1>

<style>
  .bank-heading {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 42px;
    text-align: center;
    margin-top: 40px;
    color: #00416A;
    background: linear-gradient(to right, #00416A, #00b4db);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: bold;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.2);
    animation: fadeIn 2s ease-in-out;
  }

  .bank-heading strong {
    color: #ff6600; /* highlight the bank name */
    -webkit-text-fill-color: #ff6600;
    text-shadow: 2px 2px 8px rgba(255, 102, 0, 0.5);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
    </header>

    <nav>
  <ul class="nav-menu">
    <li><a href="index.html">Gold Loan Form</a></li>
    <li><a href="#">Transactions</a></li>
    <li><a href="#">Payments</a></li>
    <li><a href="#">Settings</a></li>
    <li><a href="Login_page.html">Logout</a></li>
  </ul>
</nav>

    <main>
      <h2>Hello, valued customer!</h2>
      <p>This is your dashboard. From here, you can manage your accounts, view transactions, and make payments.</p>
    </main>
  </div>
</body>
</html>
