<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Secure Bank</title>
    <link rel="stylesheet" href="prince_style.css">
</head>
<body>
    <div class="login-container">
        <img src="images/bank-logo.png" alt="Bank Logo" class="logo">

        <h2>Forgot Password?</h2>
        <p class="instruction-text">Enter your registered email address or username, and we'll send you instructions to reset your password.</p>

        <form id="forgotPasswordForm">
            <div class="input-group">
                <label for="recovery-identity">Email or Username</label>
                <input type="text" id="recovery-identity" placeholder="e.g. prince@email.com" required>
            </div>

            <button type="submit" class="btn-primary">Send Reset Link</button>

            <div class="form-footer">
                <a href="Login_page.html" class="back-link">← Back to Login</a>
            </div>
        </form>

        <div id="success-container" style="display: none;">
            <p class="success-message">Check your inbox! If an account exists, you'll receive a reset link shortly.</p>
            <a href="Login_page.html" class="btn-secondary">Return to Login</a>
        </div>
    </div>

    <script src="forgot_password_script.js"></script>
</body>
</html>
